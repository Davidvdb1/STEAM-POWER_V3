<div id="container">
    <div class="carousel-container" tabindex="0" aria-roledescription="carousel">
        <button event="click | prev | 1" class="nav-arrow left" aria-label="Previous slide">‹</button>

        <div class="carousel-track">
            <!-- Any number of slides go here from light DOM -->
            <slot part="slides"></slot>
        </div>

        <button event="click | next | 1" class="nav-arrow right" aria-label="Next slide">›</button>
    </div>

    <!-- Dots will be generated by JS -->
    <div class="dots" bind="dotsHost"></div>
</div>

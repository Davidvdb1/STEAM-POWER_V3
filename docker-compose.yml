version: '3.8'

services:
  frontend:
    build: ./Frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build: ./Backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/steampower?schema=public
      - JWT_SECRET=${JWT_SECRET:-wqazxscdvfbgnhumpliotrbvdrcryrdszxrazwtfrybcugfnygbtfudysvnefpmdilvjklouhiyrgfgbrszcfrcdbsqtdshgftjsdfteytqshffffuvdugbcsyuevbfysdgfuzegfbypmpkvgapdfercoosjjnsgfesiooqmm}
      - JWT_EXPIRES_HOURS=8
    command: sh -c "sleep 5 && npx prisma db push --accept-data-loss && node util/seed.js && npm start"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: steampower
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d steampower"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: